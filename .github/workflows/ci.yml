name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t universal-edi-parser .
      - name: Smoke test the container
        run: |
          docker run -d --name edi -p 8080:8080 universal-edi-parser
          for i in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs --data-binary @samples/x12/5010/850_purchase_order.edi "localhost:8080/v1/parse?include=summary" \
            | tee /dev/stderr | grep -q '"valid": true'

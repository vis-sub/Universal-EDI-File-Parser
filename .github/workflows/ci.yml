name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples tools
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t universal-edi-parser .
      - name: Smoke test the container
        run: |
          docker run -d --name edi -p 8080:8080 universal-edi-parser
          for _ in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          scripts/smoke-test.sh http://localhost:8080
      - name: Scan image for fixable HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 universal-edi-parser

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config -q
      - name: Kubernetes manifests match the API schemas
        run: |
          for o in local production; do kubectl kustomize "deploy/kubernetes/overlays/$o" > "k8s-$o.yaml"; done
          docker run --rm -v "$PWD:/w:ro" ghcr.io/yannh/kubeconform:latest -strict -summary \
            /w/k8s-local.yaml /w/k8s-production.yaml /w/deploy/kubernetes/base/ingress.example.yaml

# Load balancer for `docker compose up --scale ediparse=N`.
worker_processes auto;
events { worker_connections 4096; }

http {
    # Docker's embedded DNS. Re-resolving every 10s picks up replicas added or removed with --scale;
    # when the name resolves to several replicas, nginx round-robins across them.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    client_max_body_size 1g;          # keep in step with EDIPARSE_MAX_UPLOAD_MB

    server {
        listen 8080;

        location = /lb-health { return 200 "ok\n"; }

        location / {
            set $backend http://ediparse:8080;   # a variable forces runtime DNS resolution
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_request_buffering off;  # the service spools uploads itself; don't spool twice
            proxy_buffering off;          # pass NDJSON records through as they are produced
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}

# Production: the published image at a pinned release tag.
#   kubectl apply -k deploy/kubernetes/overlays/production -n edi
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/vis-sub/universal-edi-file-parser
    newTag: v0.3.0            # pin a release; avoid :latest in production

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ediparse
  labels: {app.kubernetes.io/name: ediparse}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: ediparse}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ediparse}
    spec:
      # Long uploads/streams get time to finish when a pod is replaced or scaled in.
      terminationGracePeriodSeconds: 300
      # Don't inject docker-link style env vars (EDIPARSE_PORT=tcp://...) for Services in the namespace.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ediparse
          image: ghcr.io/vis-sub/universal-edi-file-parser:latest   # overridden by kustomization.yaml `images:`
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: WEB_CONCURRENCY, value: "2"}            # match resources.limits.cpu
            - {name: EDIPARSE_MAX_UPLOAD_MB, value: "1024"}
            - {name: EDIPARSE_SPOOL_MEMORY_MB, value: "16"}
          resources:
            requests: {cpu: "1", memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6        # a pod busy parsing must not be killed for a slow probe
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}   # let the Service stop routing before shutdown begins
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: spool, mountPath: /tmp}
      volumes:
        - name: spool            # uploads larger than EDIPARSE_SPOOL_MEMORY_MB spill here
          emptyDir: {sizeLimit: 4Gi}

# Base manifests. Apply an overlay rather than this directory directly:
#   kubectl apply -k deploy/kubernetes/overlays/production -n edi
#   kubectl apply -k deploy/kubernetes/overlays/local -n edi       (local clusters)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace: edi
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
images:
  - name: ghcr.io/vis-sub/universal-edi-parser
    newTag: latest           # pin a release tag (e.g. v0.3.0) for production

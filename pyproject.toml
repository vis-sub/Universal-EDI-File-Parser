[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ediparse"
version = "0.3.0"
description = "Universal EDI reader: detects X12, EDIFACT, TRADACOMS and HL7 v2 and parses any file into an envelope tree without needing mappings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vis-sub" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["edi", "x12", "edifact", "tradacoms", "hl7", "parser", "hipaa", "837", "850"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/vis-sub/universal-edi-parser"
Issues = "https://github.com/vis-sub/universal-edi-parser/issues"

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.20", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
ediparse = "ediparse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "E501", "SIM108", "PLW2901", "PLC0415"]

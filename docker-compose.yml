# docker compose up --build    ->  http://localhost:8080/docs
services:
  ediparse:
    build: .
    image: universal-edi-parser:latest
    ports:
      - "${EDIPARSE_HOST_PORT:-8080}:8080"
    environment:
      WEB_CONCURRENCY: "2"              # worker processes; roughly one per CPU core
      EDIPARSE_MAX_UPLOAD_MB: "1024"     # reject larger uploads with 413
      EDIPARSE_SPOOL_MEMORY_MB: "16"     # per-request upload buffer before spilling to /tmp
    tmpfs:
      - /tmp:size=2g                     # spooled uploads; size it to concurrency x max upload
    restart: unless-stopped
